# ============================================================================
# GitLab CI pipeline for the Referenced Automation UI Framework.
#
# Stages:
#   build   - compile the framework + sample suite
#   test    - run Cucumber scenarios headless, retry only what failed
#   report  - publish Cucumber/Extent/Allure artifacts (always, even on failure)
#   deploy  - `mvn deploy` the framework jar to Nexus (main branch / tags only)
# ============================================================================

image: maven:3.9-eclipse-temurin-17

stages:
  - build
  - test
  - report
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"
  RERUN_FILE: "target/cucumber-reports/rerun.txt"

cache:
  key: "$CI_COMMIT_REF_SLUG-m2"
  paths:
    - .m2/repository

.chrome_setup: &chrome_setup
  - apt-get update -qq
  - apt-get install -y -qq chromium chromium-driver > /dev/null
  - export CHROME_DRIVER_BIN=$(command -v chromedriver)
  - echo "Using chromedriver at $CHROME_DRIVER_BIN"

build:
  stage: build
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean compile test-compile
  artifacts:
    paths:
      - target/classes
      - target/test-classes
    expire_in: 1 hour

test:
  stage: test
  before_script:
    - *chrome_setup
  script:
    - rm -f "$RERUN_FILE"
    # First attempt - never let Maven's own exit code gate the job; we gate
    # explicitly below once we know whether a retry recovered everything.
    - >
      ./mvnw $MAVEN_CLI_OPTS test
      -Dbrowser=chrome -Dheadless=true -Denv=qa
      -Dwebdriver.chrome.driver="$CHROME_DRIVER_BIN" || true
    - |
      if [ -s "$RERUN_FILE" ]; then
        echo "== Retrying failed scenarios =="
        cat "$RERUN_FILE"
        # cucumber.features takes a comma-separated feature-path list, not
        # the classic CLI's "@rerun.txt" indirection - that syntax is only
        # understood by io.cucumber.core.cli.Main, and silently discovers
        # zero tests (not an error) when passed to this JUnit-Platform-based
        # setup instead, which would make this retry a silent no-op.
        RETRY_FEATURES=$(paste -sd, "$RERUN_FILE")
        ./mvnw $MAVEN_CLI_OPTS test \
          -Dbrowser=chrome -Dheadless=true -Denv=qa \
          -Dwebdriver.chrome.driver="$CHROME_DRIVER_BIN" \
          -Dcucumber.features="$RETRY_FEATURES" || true
      fi
    - |
      if [ -s "$RERUN_FILE" ]; then
        echo "Scenarios still failing after retry:"
        cat "$RERUN_FILE"
        exit 1
      fi
      echo "All scenarios passed (first attempt or after retry)."
  artifacts:
    when: always
    paths:
      - target/cucumber-reports/
      - target/extent-report/
      - target/allure-results/
      - target/screenshots/
      - logs/
    reports:
      junit: target/cucumber-reports/cucumber.xml
    expire_in: 30 days

pages:
  stage: report
  image: node:20-slim
  needs: ["test"]
  script:
    - npm install -g allure-commandline --silent
    - allure generate target/allure-results --clean -o public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:
  stage: deploy
  script:
    - |
      cat > ci-settings.xml <<EOF
      <settings>
        <servers>
          <server><id>nexus-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
          <server><id>nexus-snapshots</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
        </servers>
      </settings>
      EOF
    - ./mvnw $MAVEN_CLI_OPTS -s ci-settings.xml -DskipTests deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
