# ============================================================================
# GitLab CI pipeline for referenced-automation-ui.
#
# Triggers on: any push to main (including a merge request being merged),
# every merge request, and manual "Run pipeline" from the GitLab UI - see
# the `workflow:` block below.
#
# Dependency note: this repo depends on referenced-automation-utils, not
# yet published to a registry - see that repo's README for why (local
# npm-pack distribution until Nexus/Artifactory is wired up for this
# family's own packages). The `build` stage below clones it fresh and
# packages it with its own scripts/create-package.sh, the exact same
# script a developer runs locally, so CI and local setup never diverge.
#
# This assumes referenced-automation-utils lives in the same GitLab
# group/namespace as this repo (a common layout for a repo family) and is
# reachable with this job's own CI_JOB_TOKEN. If your org's GitLab layout
# differs, override UTILS_REPO_URL as a CI/CD variable (Settings > CI/CD >
# Variables) instead of editing this file.
# ============================================================================

image: mcr.microsoft.com/playwright:v1.62.1-noble

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

stages:
  - build
  - test
  - report

variables:
  UTILS_REPO_URL: "${CI_SERVER_URL}/${CI_PROJECT_NAMESPACE}/referenced-automation-utils.git"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm-cache"

cache:
  key: "${CI_COMMIT_REF_SLUG}-npm"
  paths:
    - .npm-cache/

.package_utils_dependency: &package_utils_dependency
  - SHARED_PACKAGES_DIR="$(realpath "${CI_PROJECT_DIR}/../shared-packages")"
  - mkdir -p "$SHARED_PACKAGES_DIR"
  - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${UTILS_REPO_URL#https://}" /tmp/referenced-automation-utils
  - bash /tmp/referenced-automation-utils/scripts/create-package.sh "$SHARED_PACKAGES_DIR"

build:
  stage: build
  script:
    - *package_utils_dependency
    - npm ci
    - npm run build
    - npm run lint
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

test:
  stage: test
  needs: ["build"]
  parallel:
    matrix:
      - BROWSER: [chromium, firefox, webkit]
  script:
    - *package_utils_dependency
    - npm ci
    - HEADLESS=true npm test
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
      - allure-results/
      - logs/
    reports:
      junit: test-results/junit.xml
    expire_in: 30 days

accessibility:
  stage: test
  needs: ["build"]
  script:
    - *package_utils_dependency
    - npm ci
    - HEADLESS=true npx playwright test tests/accessibility.spec.ts
  artifacts:
    when: always
    paths:
      - test-results/
      - allure-results/
    expire_in: 30 days

pages:
  stage: report
  image: node:20-slim
  needs: ["test", "accessibility"]
  script:
    - npm install -g allure-commandline --silent
    - allure generate allure-results --clean -o public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
