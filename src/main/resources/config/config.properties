# ============================================================================
# Default configuration - applies to every environment unless overridden by
# config-<env>.properties or a -D system property / OS env var of the same
# name (see com.company.automation.config.ConfigReader for precedence rules).
# ============================================================================

# chrome | firefox | edge
browser=chrome

# true = headless (default, CI-friendly) | false = show the browser window
headless=true

# Leave blank to run locally. Set to a Selenium Grid / cloud URL
# (e.g. http://localhost:4444/wd/hub) to run remotely instead.
grid.url=

implicit.wait.seconds=5
explicit.wait.seconds=15
pageload.timeout.seconds=30
