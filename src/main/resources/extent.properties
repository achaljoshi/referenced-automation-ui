# ============================================================================
# tech.grasshopper:extentreports-cucumber7-adapter configuration.
# Shipped as a sensible default inside the framework jar - a consuming
# project can override any of these keys simply by placing its own
# extent.properties higher on the classpath (e.g. its own src/test/resources).
#
# Registered as a Cucumber plugin via (see junit-platform.properties):
#   com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:
# ============================================================================

# Spark (HTML) reporter output
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-report/ExtentSparkReport.html
extent.reporter.spark.config=extent-spark-config.xml

# Where failure screenshots referenced by the report are read from/written,
# relative to the report file. Kept in sync with
# com.company.automation.utils.ScreenshotUtils (target/screenshots).
screenshot.dir=target/screenshots/
screenshot.rel.path=../screenshots/
