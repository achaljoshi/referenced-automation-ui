# ============================================================================
# cucumber-junit-platform-engine configuration for this repo's own
# self-verification suite (src/test). Consuming projects that import this
# jar will have their own junit-platform.properties with their own feature
# location and an extended glue path - see README.md "Using this as a
# dependency".
# ============================================================================

# Where to find step definitions and hooks. com.company.automation.hooks
# ships in the framework jar (driver lifecycle + failure screenshots);
# com.company.automation.stepdefinitions is this repo's own demo glue.
cucumber.glue=com.company.automation.hooks,com.company.automation.stepdefinitions

# Plugin chain:
#  - pretty / summary            human-readable console output
#  - json / junit                machine-readable reports for CI test-report UIs
#  - rerun                       failed scenarios written here for the retry step (see CI files)
#  - StepLoggerPlugin            per-step SLF4J/Log4j2 logging (console + logs/automation.log)
#  - ExtentCucumberAdapter       Extent Spark HTML report (config: extent.properties)
#  - AllureCucumber7Jvm          Allure results (config: allure.properties)
cucumber.plugin=pretty, \
  summary, \
  json:target/cucumber-reports/cucumber.json, \
  junit:target/cucumber-reports/cucumber.xml, \
  rerun:target/cucumber-reports/rerun.txt, \
  com.company.automation.reporting.StepLoggerPlugin, \
  com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:, \
  io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

cucumber.publish.quiet=true

# ----------------------------------------------------------------------------
# Parallel execution - safe because DriverManager keeps one WebDriver per
# thread. Tune fixed.parallelism to the number of browser sessions your
# CI runner/grid can actually sustain.
# ----------------------------------------------------------------------------
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.execution-mode.feature=concurrent

# ----------------------------------------------------------------------------
# Retry logic
# ----------------------------------------------------------------------------
# cucumber-junit-platform-engine has no built-in "retry failed scenario N
# times" property (verified against the engine's own README). The
# industry-standard approach - used here - is the rerun-file pattern:
#   1. This run writes every failed scenario to target/cucumber-reports/rerun.txt
#      (the "rerun:" plugin above).
#   2. CI (see .gitlab-ci.yml / .github/workflows/ci.yml) checks whether that
#      file is non-empty and, if so, re-invokes Maven with:
#        -Dcucumber.features=@target/cucumber-reports/rerun.txt
#      cucumber.features overrides the @SelectClasspathResource("features")
#      annotation on the runner, so only the previously-failed scenarios run.
#   3. A scenario that passes on retry is reported as passed; the pipeline
#      only fails if it fails again on the retry attempt too.
# This keeps retry behaviour identical locally (run scripts/retry-failed.sh)
# and in CI, with no custom Java retry framework to maintain.
